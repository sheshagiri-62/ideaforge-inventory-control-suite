<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders | IdeaForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="layout-shell">
      <aside class="sidebar panel">
        <div class="brand-block">
          <div class="brand-mark">IF</div>
          <div>
            <p class="brand-kicker">Portfolio project</p>
            <h1>IdeaForge</h1>
          </div>
        </div>

        <nav class="nav-menu">
          <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="nav-link" href="{{ url_for('products_page') }}">Products</a>
          <a class="nav-link" href="{{ url_for('suppliers_page') }}">Suppliers</a>
          <a class="nav-link active" href="{{ url_for('orders_page') }}">Orders</a>
          <a class="nav-link" href="{{ url_for('reports_page') }}">Reports</a>
        </nav>

        <div class="sidebar-footer">
          <span class="user-badge">{{ stats.username }}</span>
          <a class="secondary-btn full-width text-link" href="{{ url_for('logout') }}">Logout</a>
        </div>
      </aside>

      <main class="content-panel">
        <header class="top-nav panel">
          <div>
            <p class="eyebrow">Inventory Control Suite</p>
            <h2>Orders</h2>
          </div>
          <button id="refreshBtn" class="secondary-btn">Refresh</button>
        </header>

        <section class="content-grid three-col">
          <div class="panel card-block">
            <div class="section-header">
              <h3>Sales Orders</h3>
            </div>
            <div class="mini-box">
              <span class="mini-label">Status</span>
              <strong>Ready for workflow</strong>
            </div>
          </div>

          <div class="panel card-block">
            <div class="section-header">
              <h3>Purchase Orders</h3>
            </div>
            <div class="mini-box">
              <span class="mini-label">Status</span>
              <strong>Supplier linked</strong>
            </div>
          </div>

          <div class="panel card-block">
            <div class="section-header">
              <h3>Stock Impact</h3>
            </div>
            <div class="mini-box">
              <span class="mini-label">Status</span>
              <strong>Live inventory updates</strong>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
